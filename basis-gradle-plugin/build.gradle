plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation gradleTestKit()
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    withSourcesJar()
    withJavadocJar()
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(11)
}

test {
    useJUnitPlatform()
}

gradlePlugin {
    plugins {
        basisTextureEncoder {
            id = 'org.ngengine.basis.texture-encoder'
            implementationClass = 'org.ngengine.basis.gradle.BasisTextureEncoderPlugin'
        }
    }
}

publishing {
    repositories {
        mavenLocal()
    }
    publications {
        withType(MavenPublication).configureEach {
            pom {
                name = 'jBasis Universal Gradle Texture Encoder Plugin'
                description = 'Gradle plugin that converts image resources to Basis Universal textures at build time.'
                url = 'https://github.com/NostrGameEngine/jBasisUniversalDecoder'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'nostr-game-engine'
                        name = 'Nostr Game Engine'
                        organizationUrl = 'https://github.com/NostrGameEngine'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/NostrGameEngine/jBasisUniversalDecoder.git'
                    developerConnection = 'scm:git:ssh://git@github.com/NostrGameEngine/jBasisUniversalDecoder.git'
                    url = 'https://github.com/NostrGameEngine/jBasisUniversalDecoder'
                }
            }
        }
    }
}

def requiredBasisuBinaries = [
        'darwin-aarch64/basisu',
        'darwin-x86_64/basisu',
        'linux-aarch64/basisu',
        'linux-x86_64/basisu',
        'windows-aarch64/basisu.exe',
        'windows-x86_64/basisu.exe'
]

tasks.register('verifyBundledBasisuBinaries') {
    group = 'verification'
    description = 'Verifies that release packaging includes basisu executables for all supported platforms.'

    doLast {
        List<String> missing = []
        for (String relativePath : requiredBasisuBinaries) {
            File binary = file("src/main/resources/basisu-bin/${relativePath}")
            if (!binary.isFile() || binary.length() == 0L) {
                missing.add(relativePath)
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException('Missing bundled basisu binaries:\n' + missing.join('\n'))
        }
    }
}
