plugins {
    id 'java'
}

dependencies {
    testImplementation project(':decoder')
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(11)
}

def basisuReferenceSource = layout.buildDirectory.dir('basisu-reference/src')
def basisuReferenceBuild = layout.buildDirectory.dir('basisu-reference/cmake-build')
def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
// Keep the native parity reference numerically aligned with Java's explicit float operations.
def nativeFloatingPointFlags = isWindows ? [] : ['-ffp-contract=off']
def basisuExecutableName = isWindows
        ? 'basisu.exe'
        : 'basisu'
def basisuExecutable = basisuReferenceSource.map { it.file("bin/${basisuExecutableName}") }
def basisuRawTranscodeExecutableName = isWindows
        ? 'basisu_raw_transcode.exe'
        : 'basisu_raw_transcode'
def basisuRawTranscodeExecutable = layout.buildDirectory.file("basisu-reference/${basisuRawTranscodeExecutableName}")

tasks.register('syncBasisUniversalReference', Sync) {
    dependsOn rootProject.tasks.named('prepareBasisUniversalSource')
    from rootProject.layout.buildDirectory.dir('basisu-patched/src')
    into basisuReferenceSource
    exclude '.git/**', 'build/**', 'bin/**'
}

tasks.register('configureBasisuReference', Exec) {
    dependsOn tasks.named('syncBasisUniversalReference')
    inputs.dir basisuReferenceSource
    outputs.dir basisuReferenceBuild
    commandLine 'cmake',
            '-S', basisuReferenceSource.get().asFile.absolutePath,
            '-B', basisuReferenceBuild.get().asFile.absolutePath,
            '-DCMAKE_BUILD_TYPE=Release',
            '-DBASISU_EXAMPLES=OFF',
            '-DBASISU_OPENCL=OFF',
            "-DCMAKE_CXX_FLAGS=${nativeFloatingPointFlags.join(' ')}"
}

tasks.register('buildBasisuReference', Exec) {
    group = 'verification'
    description = 'Builds the pinned Basis Universal command line tool with the local encoder patches.'
    dependsOn tasks.named('configureBasisuReference')
    outputs.file basisuExecutable
    commandLine 'cmake',
            '--build', basisuReferenceBuild.get().asFile.absolutePath,
            '--target', 'basisu',
            '--config', 'Release',
            '--parallel'
}

tasks.register('buildBasisuRawTranscode', Exec) {
    group = 'verification'
    description = 'Builds a tiny official-transcoder raw dump harness for parity tests.'
    dependsOn tasks.named('buildBasisuReference')
    inputs.file layout.projectDirectory.file('src/test/harness/basisu_raw_transcode.cpp')
    inputs.file basisuReferenceBuild.map { it.file('libbasisu_encoder.a') }
    outputs.file basisuRawTranscodeExecutable
    commandLine 'c++',
            '-std=c++17',
            '-O2',
            '-DNDEBUG',
            *nativeFloatingPointFlags,
            '-I', basisuReferenceSource.get().asFile.absolutePath,
            '-I', basisuReferenceSource.get().file('transcoder').asFile.absolutePath,
            layout.projectDirectory.file('src/test/harness/basisu_raw_transcode.cpp').asFile.absolutePath,
            basisuReferenceBuild.get().file('libbasisu_encoder.a').asFile.absolutePath,
            '-lpthread',
            '-o', basisuRawTranscodeExecutable.get().asFile.absolutePath
}

test {
    useJUnitPlatform()
    dependsOn tasks.named('buildBasisuRawTranscode')
    dependsOn 'testBasisuDdsMips', 'testBasisuDdsReadFailures'
    systemProperty 'basisu.executable', basisuExecutable.get().asFile.absolutePath
    systemProperty 'basisu.rawTranscode.executable', basisuRawTranscodeExecutable.get().asFile.absolutePath
}

def ddsMipsExecutable = layout.buildDirectory.file('native-regressions/dds-mips' + (isWindows ? '.exe' : ''))
def ddsReadsExecutable = layout.buildDirectory.file('native-regressions/dds-read-failures' + (isWindows ? '.exe' : ''))

tasks.register('buildBasisuDdsMips', Exec) {
    dependsOn rootProject.tasks.named('prepareBasisUniversalSource')
    inputs.file 'src/test/harness/basisu_dds_mip_chain_test.cpp'
    inputs.file rootProject.layout.buildDirectory.file('basisu-patched/src/encoder/3rdparty/tinydds.h')
    outputs.file ddsMipsExecutable
    doFirst { ddsMipsExecutable.get().asFile.parentFile.mkdirs() }
    commandLine 'c++', '-std=c++17', '-O2',
            '-I', rootProject.layout.buildDirectory.dir('basisu-patched/src').get().asFile.absolutePath,
            file('src/test/harness/basisu_dds_mip_chain_test.cpp').absolutePath,
            '-o', ddsMipsExecutable.get().asFile.absolutePath
}

tasks.register('testBasisuDdsMips', Exec) {
    group = 'verification'
    description = 'Checks DDS mip tails, cubemaps, failed seeks and allocation cleanup.'
    dependsOn 'buildBasisuDdsMips'
    commandLine ddsMipsExecutable.get().asFile.absolutePath
}

tasks.register('buildBasisuDdsReadFailures', Exec) {
    dependsOn tasks.named('buildBasisuRawTranscode')
    inputs.file 'src/test/harness/basisu_dds_read_failure_test.cpp'
    inputs.file basisuReferenceBuild.map { it.file('libbasisu_encoder.a') }
    outputs.file ddsReadsExecutable
    doFirst { ddsReadsExecutable.get().asFile.parentFile.mkdirs() }
    commandLine 'c++', '-std=c++17', '-O2', '-DNDEBUG', *nativeFloatingPointFlags,
            '-I', basisuReferenceSource.get().asFile.absolutePath,
            '-I', basisuReferenceSource.get().file('transcoder').asFile.absolutePath,
            file('src/test/harness/basisu_dds_read_failure_test.cpp').absolutePath,
            basisuReferenceBuild.get().file('libbasisu_encoder.a').asFile.absolutePath,
            '-lpthread', '-o', ddsReadsExecutable.get().asFile.absolutePath
}

tasks.register('testBasisuDdsReadFailures', Exec) {
    group = 'verification'
    description = 'Checks the native DDS image reader with truncated LDR and HDR mip payloads.'
    dependsOn 'buildBasisuDdsReadFailures'
    def fixtures = layout.buildDirectory.dir('native-regressions/dds-fixtures')
    doFirst { fixtures.get().asFile.mkdirs() }
    commandLine ddsReadsExecutable.get().asFile.absolutePath, fixtures.get().asFile.absolutePath
}
