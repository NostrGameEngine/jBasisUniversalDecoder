plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation gradleTestKit()
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    withSourcesJar()
    withJavadocJar()
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(11)
}

test {
    useJUnitPlatform()
}

gradlePlugin {
    plugins {
        basisTextureEncoder {
            id = 'org.ngengine.basis.texture-encoder'
            implementationClass = 'org.ngengine.basis.gradle.BasisTextureEncoderPlugin'
        }
    }
}

publishing {
    repositories {
        mavenLocal()
    }
    publications {
        withType(MavenPublication).configureEach {
            pom {
                name = 'jBasis Universal Gradle Texture Encoder Plugin'
                description = 'Gradle plugin that converts image resources to Basis Universal textures at build time.'
                url = 'https://github.com/NostrGameEngine/jBasisUniversalDecoder'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'nostr-game-engine'
                        name = 'Nostr Game Engine'
                        organizationUrl = 'https://github.com/NostrGameEngine'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/NostrGameEngine/jBasisUniversalDecoder.git'
                    developerConnection = 'scm:git:ssh://git@github.com/NostrGameEngine/jBasisUniversalDecoder.git'
                    url = 'https://github.com/NostrGameEngine/jBasisUniversalDecoder'
                }
            }
        }
    }
}

def requiredBasisuBinaries = [
        'darwin-aarch64/basisu',
        'darwin-x86_64/basisu',
        'linux-aarch64/basisu',
        'linux-x86_64/basisu',
        'windows-aarch64/basisu.exe',
        'windows-x86_64/basisu.exe'
]
def nativeSha256 = { File input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString()
}

tasks.register('verifyBundledBasisuBinaries') {
    group = 'verification'
    description = 'Verifies bundled encoder hashes and the source patch recipe for all supported platforms.'
    inputs.files(fileTree('src/main/resources/basisu-bin'),
            file('src/main/resources/META-INF/native-basis/binaries.json'),
            rootProject.fileTree('vendor/basis-universal') { include '*.patch', 'manifest.json' })

    doLast {
        List<String> missing = []
        for (String relativePath : requiredBasisuBinaries) {
            File binary = file("src/main/resources/basisu-bin/${relativePath}")
            if (!binary.isFile() || binary.length() == 0L) {
                missing.add(relativePath)
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException('Missing bundled basisu binaries:\n' + missing.join('\n'))
        }
        def bindings = new groovy.json.JsonSlurper().parse(
                file('src/main/resources/META-INF/native-basis/binaries.json'))
        def recipe = new groovy.json.JsonSlurper().parse(rootProject.file('vendor/basis-universal/manifest.json'))
        if (bindings.upstreamBase != recipe.upstreamBase || bindings.patches != recipe.patches) {
            throw new GradleException('Bundled encoders do not match the current native source patch recipe')
        }
        recipe.patches.each { row ->
            if (nativeSha256(rootProject.file("vendor/basis-universal/${row.path}")) != row.sha256) {
                throw new GradleException('Native patch differs from the bundled source recipe: ' + row.path)
            }
        }
        if (bindings.binaries.keySet() != requiredBasisuBinaries.collect { it.substring(0, it.indexOf('/')) }.toSet()) {
            throw new GradleException('Bundled encoder manifest must cover all six supported platforms')
        }
        requiredBasisuBinaries.each { String path ->
            File binary = file("src/main/resources/basisu-bin/${path}")
            def row = bindings.binaries[path.substring(0, path.indexOf('/'))]
            if (row.path != path || row.bytes != binary.length() || row.sha256 != nativeSha256(binary)) {
                throw new GradleException('Bundled encoder differs from its source binding: ' + path)
            }
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('verifyBundledBasisuBinaries')
    from(rootProject.file('vendor/basis-universal')) {
        include '*.patch', 'manifest.json'
        into 'META-INF/native-basis'
    }
    from(rootProject.file('basis_universal/LICENSE')) {
        into 'META-INF/native-basis'
        rename { 'LICENSE-Apache-2.0.txt' }
    }
    from(rootProject.file('basis_universal/NOTICE')) {
        into 'META-INF/native-basis'
        rename { 'NOTICE-Basis-Universal.txt' }
    }
    from(rootProject.file('basis_universal/zstd/LICENSE')) {
        into 'META-INF/native-basis'
        rename { 'LICENSE-Zstandard-BSD.txt' }
    }
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('processResources')
    from(layout.buildDirectory.dir('resources/main')) {
        include 'META-INF/native-basis/*.patch', 'META-INF/native-basis/manifest.json',
                'META-INF/native-basis/LICENSE*.txt', 'META-INF/native-basis/NOTICE-Basis-Universal.txt'
    }
}
